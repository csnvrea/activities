<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse activities and student projects.">
  <title>Activities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #120d16;
      --bg-soft: #1c1220;
      --panel: rgba(255, 246, 250, 0.07);
      --text: #fff7fa;
      --muted: #c9b4bf;
      --line: rgba(255, 228, 238, 0.15);
      --rose: #ffadc5;
      --rose-deep: #d86691;
      font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 3rem 1.25rem;
      background:
        linear-gradient(120deg, rgba(255, 173, 197, 0.14) 0%, transparent 32%),
        linear-gradient(240deg, rgba(133, 212, 201, 0.09) 0%, transparent 36%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      overflow-x: clip;
    }

    .ambient {
      position: fixed;
      z-index: -1;
      width: 45vw;
      height: 24rem;
      filter: blur(80px);
      pointer-events: none;
      border-radius: 50%;
    }

    .ambient-one { top: 4rem; left: -14vw; background: radial-gradient(ellipse, rgba(255, 173, 197, 0.22), transparent 70%); }
    .ambient-two { right: -12vw; bottom: 2rem; background: radial-gradient(ellipse, rgba(133, 212, 201, 0.16), transparent 70%); }

    .page-frame { position: fixed; inset: 0.8rem; z-index: -1; border: 1px solid rgba(255, 228, 238, 0.08); border-radius: 0.5rem; pointer-events: none; }
    main { width: min(100%, 760px); margin: 0 auto; }
    h1 { margin: 0 0 2rem; font-family: "Playfair Display", Georgia, serif; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.04em; }

    .activity-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(14, 8, 18, 0.45);
      color: var(--text);
      text-decoration: none;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .activity-card:hover { transform: translateY(-4px); border-color: rgba(255, 173, 197, 0.4); box-shadow: 0 18px 42px rgba(255, 173, 197, 0.18); }
    .activity-card:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
    .activity-number { display: block; margin-bottom: 0.35rem; color: var(--rose); font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h2 { margin: 0; font-size: 1.3rem; font-weight: 800; }
    .activity-description { margin: 0.35rem 0 0; color: var(--muted); }

    @media (max-width: 520px) {
      body { padding-top: 2rem; }
      .activity-card { align-items: flex-start; padding: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="page-frame" aria-hidden="true"></div>
  <main>
    <h1>Browse activities</h1>

    <a class="activity-card" href="activity-1/">
      <span>
        <strong class="activity-number">Activity 1</strong>
        <h2>Studyspace</h2>
        <p class="activity-description">A BSIT subject hub with course topics and class details.</p>
      </span>
    </a>
  </main>
</body>
</html>
